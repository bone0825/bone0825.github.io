# ─────────────────────────────────────────────
#  사이트 기본 정보 — 여기만 고치면 전체에 반영돼
# ─────────────────────────────────────────────
title: "김병일 | 데이터 인프라"
tagline: "Snowflake · 데이터 파이프라인 · AI"
description: >-
  데이터 인프라 엔지니어. Snowflake 기반 플랫폼과 AI Agent를 만들고,
  틀렸던 판단과 그걸 고친 과정을 기록합니다.

author:
  name: "김병일"
  email: ""          # 공개 노출 원하면 여기에 (public 저장소라 크롤링됩니다)

# GitHub Pages 주소 (username 을 본인 GitHub 아이디로 바꿔주세요)
url: "https://bone0825.github.io"
baseurl: ""          # username.github.io 저장소면 빈 값 그대로 두세요

# 저장소 (웹에서 글 쓰기/수정 링크에 사용)
repo: "bone0825/bone0825.github.io"
branch: "main"

# 헤더/푸터에 표시되는 링크
social:
  github: "bone0825"
  email: ""           # 비워두면 푸터에 이메일 링크가 안 나옵니다
  linkedin: ""        # 없으면 비워두세요

# ─────────────────────────────────────────────
#  Jekyll 설정 (건드릴 일 거의 없음)
# ─────────────────────────────────────────────
lang: ko-KR
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge

# 글 주소 형식.
# 기본값은 카테고리를 주소에 넣어서, 한글 카테고리면 /%EA%B8%B0%EB%A1%9D/... 로 깨집니다.
# 파일명 slug 만 쓰도록 고정 (예: /posts/blog-start/)
permalink: /posts/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
